<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Granblue GW Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="nav"><a href="/">Dashboard</a><a href="/admin/events">Events</a><a href="/admin/nextevent">Next Event</a></div>
        <h1>Settings</h1>
        <form method="post" action="/admin/settings">
            {% for k,v in intervals.items() %}
            <p><label>{{ k }} offset (seconds): <input type="number" name="{{ k }}" value="{{ v }}"></label></p>
            {% endfor %}
            <button type="submit">Save</button>
        </form>
    </div>
</body>
</html>
